name: TextWallpaper
options:
  bundleIdPrefix: me.byeolki
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 2Y4YA3Y8TM
    CODE_SIGN_STYLE: Automatic
targets:
  TextWallpaper:
    type: application
    platform: iOS
    sources: [TextWallpaper]
    info:
      path: TextWallpaper/Info.plist
      properties:
        CFBundleDisplayName: 문장 배경화면
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts: []
        CFBundleURLTypes:
          - CFBundleURLSchemes: [textwallpaper]
        NSPhotoLibraryAddUsageDescription: 만든 배경화면을 사진 앱에 저장합니다.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.byeolki.textwallpaper
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
  TextWallpaperTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TextWallpaperTests]
    dependencies:
      - target: TextWallpaper
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TextWallpaper:
    build:
      targets:
        TextWallpaper: all
        TextWallpaperTests: [test]
    test:
      targets: [TextWallpaperTests]
